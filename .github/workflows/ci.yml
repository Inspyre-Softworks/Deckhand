name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "poetry>=2.2,<3"
      - run: poetry install --with dev --no-interaction
      - run: poetry check --lock
      - run: poetry run pytest
      - run: poetry build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "poetry>=2.2,<3"
      - run: poetry install --only main,docs --no-interaction
      - run: poetry run sphinx-build -W --keep-going -b html docs docs/_build/local-html
