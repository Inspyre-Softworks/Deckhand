version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      - pip install "poetry>=2.2,<3"
    install:
      - poetry config virtualenvs.create false
      - poetry install --only main,docs --no-interaction
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
